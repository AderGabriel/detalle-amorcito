<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Mi Universo ❤️</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#000;color:white;font-family:Arial,sans-serif}

.inicio{
  position:fixed;inset:0;background:#000;z-index:50;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:20px
}
.inicio h1{
  color:#ff4b00;font-family:Georgia,serif;
  font-size:clamp(26px,6vw,42px);
  letter-spacing:clamp(6px,2vw,18px);
}
.inicio p{
  font-size:clamp(16px,4vw,24px);
  max-width:800px;
}
.inicio button{
  margin-top:30px;padding:15px 30px;
  border:1px solid #ff4b00;background:transparent;
  color:#ff4b00;letter-spacing:4px;cursor:pointer;
}

.universo{
  display:none;position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(circle at center, rgba(255,80,0,.25), transparent 22%),
    radial-gradient(circle,#2b0400,#000);
}

.star{
  position:absolute;width:2px;height:2px;background:white;border-radius:50%;
  opacity:.7;
}

.saturno{
  position:absolute;left:50%;top:50%;
  width:clamp(120px,30vw,210px);
  height:clamp(120px,30vw,210px);
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 30% 30%,#ffcc80,#8b3e00 60%,#000);
  box-shadow:0 0 35px #ff4b00;
  z-index:5;
}

.anillo{
  position:absolute;left:50%;top:50%;
  width:clamp(220px,55vw,380px);
  height:clamp(60px,18vw,110px);
  border-radius:50%;
  border:8px solid #ff6a00;
  transform:translate(-50%,-50%) rotateX(70deg);
  z-index:6;
}
.anillo.back{z-index:4;opacity:.4}

.frase{
  position:absolute;left:50%;top:50%;
  white-space:nowrap;
  font-weight:bold;
  color:white;
  text-shadow:0 0 6px #ff4b00,0 0 15px #ff4b00;
}

.info{
  position:absolute;bottom:20px;width:100%;
  text-align:center;font-size:14px;
  opacity:.6;
}
</style>
</head>

<body>

<div class="inicio" id="inicio">
  <div>
    <h1>1 DE MAYO</h1>
    <p>Hoy comienza un nuevo mes, y mi mayor motivo para sonreír es haberte conocido.</p>
    <button onclick="entrar()">ENTRAR AL UNIVERSO</button>
  </div>
</div>

<div class="universo" id="universo">
  <div class="anillo back"></div>
  <div class="saturno"></div>
  <div class="anillo"></div>
  <div class="info">✨ Para ti ✨</div>
</div>

<script>
const frases = [
  "Te amo ❤️",
  "Mi reina 👑",
  "Eres única 💖",
  "Mi vida ✨",
  "Mi universo 🌌",
  "Mi razón 🫶",
  "Mi luz 🌟",
  "Por siempre 💫",
  "Mi felicidad 😊",
  "Mi paz 🦋"
];

let objetos=[];
let angle=0;
let iniciado=false;

function entrar(){
  document.getElementById("inicio").style.display="none";
  document.getElementById("universo").style.display="block";

  if(!iniciado){
    estrellas();
    crearFrases();
    animar();
    iniciado=true;
  }
}

function estrellas(){
  const u=document.getElementById("universo");
  for(let i=0;i<120;i++){
    const s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    u.appendChild(s);
  }
}

function crearFrases(){
  const u=document.getElementById("universo");

  const esCelular = window.innerWidth < 700;
  const cantidad = esCelular ? 35 : 65;
  const radioBase = esCelular ? 120 : 220;
  const radioExtra = esCelular ? 260 : 620;

  for(let i=0;i<cantidad;i++){
    const f=document.createElement("div");
    f.className="frase";
    f.innerText=frases[i % frases.length];

    objetos.push({
      el:f,
      r:radioBase + Math.random()*radioExtra,
      speed:0.0015 + Math.random()*0.0025,
      a:Math.random()*Math.PI*2,
      size:esCelular ? 12+Math.random()*9 : 16+Math.random()*18
    });

    u.appendChild(f);
  }
}

function animar(){
  angle+=0.004;

  objetos.forEach(o=>{
    o.a+=o.speed;

    const x=Math.cos(o.a+angle)*o.r;
    const z=Math.sin(o.a+angle)*o.r;

    const scale=0.45+(z+500)/900;
    const y=z*0.28;

    o.el.style.fontSize=o.size+"px";
    o.el.style.opacity=0.35 + scale*0.6;
    o.el.style.zIndex=Math.floor(scale*20);

    o.el.style.transform=
      `translate(-50%,-50%) translate(${x}px,${y}px) scale(${scale})`;
  });

  requestAnimationFrame(animar);
}
</script>

</body>
</html>
