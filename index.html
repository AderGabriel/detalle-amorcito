<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti ❤️</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: rgba(255,255,255,0.2);
  padding: 30px;
  border-radius: 25px;
  text-align: center;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
  color: white;
  font-size: 30px;
}

p {
  color: white;
  font-size: 18px;
}

.heart {
  font-size: 60px;
  animation: latir 1s infinite;
}

@keyframes latir {
  0%,100% {transform: scale(1);}
  50% {transform: scale(1.3);}
}

button {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  border-radius: 20px;
  background: white;
  color: #ff4b6e;
  font-size: 16px;
  cursor: pointer;
  font-weight: bold;
}

#extra {
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">
  <div class="heart">❤️</div>
  <h1>Para ti 💕</h1>

  <p>
    Quería hacer algo diferente para ti…  
    algo que naciera de mí ❤️
  </p>

  <button onclick="mostrar()">Presiona aquí</button>

  <p id="extra"></p>
</div>

<script>
function mostrar(){
  document.getElementById("extra").innerHTML =
  "Eres lo más bonito que me ha pasado 💖";
}
</script>

</body>
</html>
