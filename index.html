<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Mi Universo ❤️</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#000;color:white;font-family:Arial,sans-serif}

.inicio{
  position:fixed;inset:0;background:#000;z-index:100;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:20px
}
.inicio h1{
  color:#ff4b00;font-family:Georgia,serif;
  font-size:clamp(26px,6vw,42px);
  letter-spacing:clamp(6px,2vw,18px);
}
.inicio p{font-size:clamp(16px,4vw,24px);max-width:800px}
.inicio button{
  margin-top:30px;padding:15px 30px;
  border:1px solid #ff4b00;background:transparent;
  color:#ff4b00;letter-spacing:4px;cursor:pointer;
}

.universo{
  display:none;position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(circle at center, rgba(255,80,0,.25), transparent 20%),
    radial-gradient(circle,#2b0400,#000);
}

.star{
  position:absolute;width:2px;height:2px;background:white;border-radius:50%;
  opacity:.7;
}

/* CONTENEDOR DEL PLANETA */
.planeta-wrap{
  position:absolute;
  left:50%;
  top:50%;
  width:clamp(280px,70vw,500px);
  height:clamp(220px,45vw,380px);
  transform:translate(-50%,-50%);
  z-index:60;
}

/* ANILLO COMPLETO ATRÁS */
.anillo-atras{
  position:absolute;
  left:50%;
  top:50%;
  width:100%;
  height:38%;
  border-radius:50%;
  transform:translate(-50%,-50%) rotate(-10deg);
  border:10px solid rgba(255,130,0,.55);
  box-shadow:0 0 25px rgba(255,90,0,.6);
  z-index:1;
}

/* PLANETA */
.saturno{
  position:absolute;
  left:50%;
  top:50%;
  width:clamp(140px,32vw,240px);
  height:clamp(140px,32vw,240px);
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,190,90,.22) 0px,
      rgba(255,190,90,.22) 5px,
      rgba(120,55,15,.25) 8px,
      rgba(120,55,15,.25) 13px
    ),
    radial-gradient(circle at 68% 30%, #ffd27a 0%, #ffb347 18%, #c96b1d 42%, #5a2d0c 68%, #070201 92%);
  box-shadow:
    0 0 65px rgba(255,110,0,.85),
    inset -35px -30px 55px rgba(0,0,0,.85),
    inset 20px 15px 35px rgba(255,220,150,.35);
  z-index:3;
  overflow:hidden;
}

.saturno::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:linear-gradient(90deg,rgba(0,0,0,.65),transparent 50%,rgba(255,210,130,.16));
}

/* SOLO LA PARTE DELANTERA DEL ANILLO */
.anillo-frente{
  position:absolute;
  left:50%;
  top:50%;
  width:100%;
  height:38%;
  border-radius:50%;
  transform:translate(-50%,-50%) rotate(-10deg);
  border:10px solid transparent;
  border-bottom-color:#ff9b1a;
  border-left-color:rgba(255,150,20,.75);
  border-right-color:rgba(255,190,90,.85);
  filter:drop-shadow(0 0 12px rgba(255,100,0,.9));
  z-index:4;
  pointer-events:none;
}

/* tapa superior del planeta para ocultar el anillo de atrás */
.tapa-planeta{
  position:absolute;
  left:50%;
  top:50%;
  width:clamp(140px,32vw,240px);
  height:clamp(70px,16vw,120px);
  transform:translate(-50%,-100%);
  border-radius:120px 120px 0 0;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,190,90,.22) 0px,
      rgba(255,190,90,.22) 5px,
      rgba(120,55,15,.25) 8px,
      rgba(120,55,15,.25) 13px
    ),
    radial-gradient(circle at 68% 30%, #ffd27a 0%, #ffb347 18%, #c96b1d 42%, #5a2d0c 68%, #070201 92%);
  z-index:5;
  pointer-events:none;
}

/* FRASES */
.frase{
  position:absolute;left:50%;top:50%;
  white-space:nowrap;
  font-weight:bold;
  color:white;
  text-shadow:0 0 6px #ff4b00,0 0 15px #ff4b00;
}

.control-musica{
  position:absolute;right:15px;bottom:15px;z-index:100;
  background:rgba(0,0,0,.45);color:white;border:1px solid #ff6a00;
  border-radius:20px;padding:10px 16px;cursor:pointer;
}

.info{
  position:absolute;bottom:20px;width:100%;
  text-align:center;font-size:14px;
  opacity:.6;
  z-index:80;
}
</style>
</head>

<body>

<div class="inicio" id="inicio">
  <div>
    <h1>NUESTRO UNIVERSO</h1>
    <p>Entre todo este universo, lo más increíble que me pasó fue encontrarte a ti❤️.</p>
    <button onclick="entrar()">ENTRAR AL UNIVERSO</button>
  </div>
</div>

<div class="universo" id="universo">

  <audio id="musica" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="planeta-wrap">
    <div class="anillo-atras"></div>
    <div class="saturno"></div>
    <div class="anillo-frente"></div>
    <div class="tapa-planeta"></div>
  </div>

  <button class="control-musica" onclick="toggleMusica()">🎵 Pausar</button>
  <div class="info">✨ Para ti ✨</div>
</div>

<script>
const frases = [
  "Te amo ❤️","Mi reina 👑","Mi todo 💖","Mi vida ✨",
  "Mi universo 🌌","Mi razón 🫶","Mi luz 🌟","Por siempre 💫",
  "Mi felicidad 😊","Mi paz 🦋"
];

let objetos=[];
let angle=0;
let iniciado=false;

function entrar(){
  document.getElementById("inicio").style.display="none";
  document.getElementById("universo").style.display="block";

  const musica=document.getElementById("musica");
  musica.volume=0;
  musica.play().catch(()=>{});

  let vol=0;
  const fade=setInterval(()=>{
    if(vol<0.55){
      vol+=0.02;
      musica.volume=vol;
    }else{
      clearInterval(fade);
    }
  },150);

  if(!iniciado){
    estrellas();
    crearFrases();
    animar();
    iniciado=true;
  }
}

function toggleMusica(){
  const musica=document.getElementById("musica");
  const boton=document.querySelector(".control-musica");

  if(musica.paused){
    musica.play();
    boton.innerText="🎵 Pausar";
  }else{
    musica.pause();
    boton.innerText="▶️ Reproducir";
  }
}

function estrellas(){
  const u=document.getElementById("universo");
  for(let i=0;i<180;i++){
    const s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    u.appendChild(s);
  }
}

function crearFrases(){
  const u=document.getElementById("universo");
  const esCelular=window.innerWidth<700;

  const cantidad=esCelular?70:140;
  const radioMin=esCelular?100:200;
  const radioMax=esCelular?600:1200;

  for(let i=0;i<cantidad;i++){
    const f=document.createElement("div");
    f.className="frase";
    f.innerText=frases[i%frases.length];

    const radio=radioMin+Math.random()*(radioMax-radioMin);

    objetos.push({
      el:f,
      r:radio,
      speed:0.0008+Math.random()*0.002,
      a:Math.random()*Math.PI*2,
      size:esCelular?12+Math.random()*12:16+Math.random()*24,
      altura:-300+Math.random()*600
    });

    u.appendChild(f);
  }
}

function animar(){
  angle+=0.003;

  objetos.forEach(o=>{
    o.a+=o.speed;

    const x=Math.cos(o.a+angle)*o.r;
    const z=Math.sin(o.a+angle)*o.r;

    const scale=0.4+(z+600)/1200;
    const y=o.altura+z*0.25;

    o.el.style.fontSize=o.size+"px";
    o.el.style.opacity=0.25+scale*0.7;
    o.el.style.zIndex=Math.floor(scale*50);

    o.el.style.transform=
      `translate(-50%,-50%) translate(${x}px,${y}px) scale(${scale})`;
  });

  requestAnimationFrame(animar);
}
</script>

</body>
</html>
